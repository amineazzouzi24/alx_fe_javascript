<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dynamic Quote Generator with Sync</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
    h1 { color: #333; }
    button, select, input { margin: 5px; padding: 8px 14px; }
    .quote-text { font-size: 1.3em; margin: 10px 0; color: #444; }
    .quote-category { color: #666; font-style: italic; }
    #sync-status { margin-top: 15px; font-size: 0.9em; color: #008000; }
  </style>
</head>
<body>
  <h1>Dynamic Quote Generator</h1>

  <label for="categoryFilter"><strong>Filter by Category:</strong></label>
  <select id="categoryFilter" onchange="filterQuote()">
    <option value="all">All Categories</option>
  </select>

  <div id="quoteDisplay"></div>
  <div id="form-container"></div>

  <div style="margin-top:20px;">
    <button id="newQuote">Show New Quote</button>
    <button id="add-btn">Add New Quote</button>
    <button id="export-btn">Export Quotes</button>
    <input type="file" id="importFile" accept=".json" onchange="importFromJsonFile(event)" />
  </div>

  <!-- ✅ Sync controls -->
  <div style="margin-top: 30px;">
    <button id="sync-btn">Sync Now</button>
    <p id="sync-status">Last sync: never</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
